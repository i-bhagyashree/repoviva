# Builds the browser-only version of RepoViva and publishes it to GitHub Pages
# on every push to main. In this build there is no server: reviews run in the
# visitor's browser and accounts/reports are stored in that browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The client reuses the server's review engine, so both need their packages.
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run build --prefix client
        env:
          VITE_STATIC: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
